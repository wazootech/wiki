name: Deploy Wiki to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Generate TypeScript API docs
        run: npm run gendocs:ts

      - name: Run Docs Wiki Integrity Audits
        run: deno run -A src/wiki/cli.ts -c docs/wiki.yml check --strict -v

      - name: Run Docs Wiki Convention Audits
        run: deno run -A src/wiki/cli.ts -c docs/wiki.yml lint --strict -v

      - name: Build Static Site
        run: deno run -A docs/build.ts --output-dir _site

      - name: Copy TypeScript API docs into site output
        run: |
          mkdir -p _site/assets/api
          cp -R docs/assets/api/ts _site/assets/api/ts

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
