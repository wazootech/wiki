name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deno-checks:
    name: Deno Engine Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Type-check the Deno engine
        run: deno task check

      - name: Lint the Deno engine
        run: deno task lint

      - name: Verify Deno formatting
        run: deno task fmt:check

      - name: Run Deno unit tests
        run: deno task test

      - name: Validate JSR package contents
        run: deno publish --dry-run

      - name: Compile and smoke-test standalone CLI
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/wiki"
          deno compile --node-modules-dir=none --frozen --allow-all --exclude-unused-npm --target x86_64-unknown-linux-gnu --output "$output" src/wiki/cli.ts
          "$output" --help
          "$output" -c docs/wiki.yml check --strict

      - name: Run Docs Wiki Integrity Audits
        run: deno run -A src/wiki/cli.ts -c docs/wiki.yml check --strict -v

      - name: Run Docs Wiki Convention Audits
        run: deno run -A src/wiki/cli.ts -c docs/wiki.yml lint --strict -v

      - name: Verify Docs Wiki Formatting
        run: deno run -A src/wiki/cli.ts -c docs/wiki.yml fmt --check -v

      - name: Verify Docs Wiki SPARQL Blocks are Up to Date
        run: deno run -A src/wiki/cli.ts -c docs/wiki.yml render --check

  npm-checks:
    name: NPM Package Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Verify TypeScript Prettier formatting
        run: npm run format:check

      - name: Verify TypeScript ESLint
        run: npm run lint

      - name: Check npm and Deno version consistency
        run: |
          node -e 'const pkg = require("./package.json"); const deno = require("./deno.json"); if (pkg.version !== deno.version) { console.error(`Version mismatch: package.json=${pkg.version} deno.json=${deno.version}`); process.exit(1); }'

      - name: Build and test npm package
        run: npm run test:npm

      - name: Verify TypeScript API docs build
        run: npm run gendocs:ts

      - name: Build static site
        run: deno run -A docs/build.ts --output-dir _site

      - name: Verify npm tarball CLI runs without Python or system Deno
        shell: bash
        run: |
          set -euo pipefail
          test_root="$RUNNER_TEMP/wiki-cli-tarball"
          blocked_path="$test_root/no-python"
          install_root="$test_root/install"
          mkdir -p "$blocked_path" "$install_root"
          for executable in python python2 python3 python3.10 python3.11 python3.12 python3.13 deno deno.exe; do
            printf '%s\n' '#!/usr/bin/env bash' 'echo "An external language runtime was invoked in this package test." >&2' 'exit 127' > "$blocked_path/$executable"
            chmod +x "$blocked_path/$executable"
          done
          tarball="$(npm pack --silent --pack-destination "$test_root")"
          case "$tarball" in
            /*) ;;
            *) tarball="$test_root/$tarball" ;;
          esac
          PATH="$blocked_path:$PATH" npm install --prefix "$install_root" --no-audit --no-fund "$tarball"
          PATH="$blocked_path:$PATH" "$install_root/node_modules/.bin/wiki" --help
