name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deno-checks:
    # This display name is the required status check context configured on
    # main's branch protection, alongside "NPM Package Checks". Renaming it
    # leaves the context unreported and every PR permanently blocked.
    name: Run Tests and Audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
          cache: true

      - name: Type-check the Deno engine
        run: deno task check

      - name: Lint the Deno engine
        run: deno task lint

      - name: Verify Deno formatting
        run: deno task fmt:check

      - name: Run Deno unit tests
        run: deno task test

      - name: Validate JSR package contents
        run: deno publish --dry-run

      - name: Run Docs Wiki Integrity Audits
        run: deno run -A src/wiki/cli.ts -c docs/wiki.yml check --strict -v

      - name: Run Docs Wiki Convention Audits
        run: deno run -A src/wiki/cli.ts -c docs/wiki.yml lint --strict -v

      - name: Verify Docs Wiki Formatting
        run: deno run -A src/wiki/cli.ts -c docs/wiki.yml fmt --check -v

      - name: Verify Docs Wiki SPARQL Blocks are Up to Date
        run: deno run -A src/wiki/cli.ts -c docs/wiki.yml render --check

  windows-tests:
    # Platform coverage for the paths ubuntu-latest cannot exercise at all:
    # source-name inference over backslash-separated paths, the symlink
    # capability probe, bash resolution in verify_cli_test, and the git-stderr
    # wording assertions. Each of those was fixed against a Windows host and
    # would silently regress without a runner here.
    #
    # Not a required status check on main's branch protection -- it is advisory
    # until the required contexts are updated, so a Windows failure will not
    # block a merge.
    name: Run Tests on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
          cache: true

      - name: Run Deno unit tests
        run: deno task test

  bun-tests:
    # The engine's tests and docs gates on Bun, ahead of the toolchain moving
    # over (wazootech/workspace#50). Bun floats on 1.x on purpose so a Bun
    # regression surfaces early. Advisory until the required contexts change.
    name: Run Tests on Bun
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run unit tests
        run: bun run test:bun

      - name: Run Docs Wiki Audits
        run: |
          bun src/wiki/cli.ts -c docs/wiki.yml check --strict -v
          bun src/wiki/cli.ts -c docs/wiki.yml lint --strict -v
          bun src/wiki/cli.ts -c docs/wiki.yml fmt --check -v
          bun src/wiki/cli.ts -c docs/wiki.yml render --check

      - name: Build static site
        run: bun docs/build.ts --output-dir _site

  npm-checks:
    # A required status check on main's branch protection; keep the name.
    name: NPM Package Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      # `npm pack` runs `prepack`, which builds `dist/`. The tarball is then
      # installed the way a user would, outside this checkout.
      - name: Pack and install the npm package
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/npm-package"
          mkdir -p "$root/install"
          tarball="$(npm pack --silent --pack-destination "$root" | tail -1)"
          npm install --prefix "$root/install" --no-audit --no-fund "$root/$tarball"
          # The package must need neither Deno nor Python.
          mkdir -p "$root/blocked"
          for executable in deno python python3; do
            printf '%s\n' '#!/usr/bin/env bash' 'echo "an external runtime was invoked" >&2' 'exit 127' > "$root/blocked/$executable"
            chmod +x "$root/blocked/$executable"
          done
          echo "$root/blocked" >> "$GITHUB_PATH"
          echo "WIKI_JS=$root/install/node_modules/wazootech-wiki/bin/wiki.js" >> "$GITHUB_ENV"

      - name: Smoke test on Node (.node-version)
        run: bash scripts/smoke_cli.sh node "$WIKI_JS"

      - name: Smoke test on Bun
        run: bash scripts/smoke_cli.sh bun "$WIKI_JS"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "18"

      - name: Smoke test on Node 18
        run: bash scripts/smoke_cli.sh node "$WIKI_JS"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Smoke test on Node 22
        run: bash scripts/smoke_cli.sh node "$WIKI_JS"

      # musl had no bundled runtime before the package ran on Node.
      - name: Smoke test on Alpine (musl)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/npm-package:/pkg:ro" node:22-alpine sh -c '
            apk add --no-cache bash curl >/dev/null &&
            npm install --prefix /tmp/install --no-audit --no-fund /pkg/*.tgz >/dev/null &&
            bash /src/scripts/smoke_cli.sh node /tmp/install/node_modules/wazootech-wiki/bin/wiki.js'

  pypi-wheels:
    # Not a required status check on main's branch protection yet; advisory
    # until the required contexts are updated.
    name: PyPI Wheel (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"

      # The same script as release.yml's `build-standalone`, cross-compiled.
      - name: Compile the standalone binary
        run: bun scripts/build_binary.ts "${{ matrix.target }}" dist/standalone/wazootech-wiki

      # build_wheel.py refuses a binary whose architecture or platform floor
      # (glibc symbol versions, macOS LC_BUILD_VERSION) does not match the
      # tag, and a wheel over PyPI's 100 MB file limit.
      - name: Build and check the platform wheel
        shell: bash
        run: |
          set -euo pipefail
          binary=dist/standalone/wazootech-wiki
          [ -f "$binary.exe" ] && binary="$binary.exe"
          python scripts/build_wheel.py --binary "$binary" --target "${{ matrix.target }}" --out dist/wheels
          uvx twine check --strict dist/wheels/*.whl
          uvx check-wheel-contents dist/wheels/*.whl
          case "${{ matrix.target }}" in
            *linux*)
              uvx auditwheel show dist/wheels/*.whl
              echo "objdump newest GLIBC_ need: $(objdump -T "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
              ;;
          esac
          ls -l "$binary" dist/wheels/*.whl | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-wheel-${{ matrix.target }}
          path: dist/wheels/*.whl
          if-no-files-found: error

  pypi-tests:
    name: PyPI Package Checks (${{ matrix.os }})
    needs: pypi-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # No Deno or Bun is set up: the wheel must run on its own.
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"

      - name: Download the platform wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-wheel-${{ matrix.target }}
          path: dist/wheels

      - name: Build the fallback wheel
        run: python scripts/build_wheel.py --pure --out dist/fallback

      # Tests run against installed wheels, never the source tree, so a
      # resource missing from the artifact fails here (#316). The end-to-end
      # tests strip PATH, so nothing but the installed binary can answer.
      - name: Install each wheel into a clean venv and test it
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          # Prints the venv's scripts directory; uv needs `python.exe` spelled
          # out on Windows.
          venv() {
            uv venv -q "$RUNNER_TEMP/$1"
            if [ "$RUNNER_OS" = "Windows" ]; then echo "$RUNNER_TEMP/$1/Scripts"; else echo "$RUNNER_TEMP/$1/bin"; fi
          }
          platform="$(venv platform-venv)"
          uv pip install --python "$platform/python$exe" dist/wheels/*.whl
          "$platform/python$exe" -m unittest discover -s python/tests -v

          # The fallback wheel against the real binary the platform wheel
          # just installed; WIKI_REQUIRE_E2E turns a missing binary into a
          # failure instead of a skip.
          fallback="$(venv fallback-venv)"
          uv pip install --python "$fallback/python$exe" dist/fallback/*.whl
          WIKI_TEST_BINARY="$platform/wiki$exe" WIKI_REQUIRE_E2E=1 \
            "$fallback/python$exe" -m unittest discover -s python/tests -v

      # The installed binary, end to end, on the platform it was built for.
      - name: Smoke test the installed command
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          scripts="$RUNNER_TEMP/platform-venv/bin"
          [ "$RUNNER_OS" = "Windows" ] && scripts="$RUNNER_TEMP/platform-venv/Scripts"
          bash scripts/smoke_cli.sh "$scripts/wiki$exe"
