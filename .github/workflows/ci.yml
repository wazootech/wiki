name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deno-checks:
    # This display name is the required status check context configured on
    # main's branch protection, alongside "NPM Package Checks". Renaming it
    # leaves the context unreported and every PR permanently blocked.
    name: Run Tests and Audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
          cache: true

      - name: Type-check the Deno engine
        run: deno task check

      - name: Lint the Deno engine
        run: deno task lint

      - name: Verify Deno formatting
        run: deno task fmt:check

      - name: Run Deno unit tests
        run: deno task test

      - name: Validate JSR package contents
        run: deno publish --dry-run

      - name: Compile and smoke-test standalone CLI
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/wiki"
          deno compile --node-modules-dir=none --frozen --allow-all --exclude-unused-npm --target x86_64-unknown-linux-gnu --output "$output" src/wiki/cli.ts
          "$output" --help
          "$output" -c docs/wiki.yml check --strict
          # `fmt` and `build` are the two commands that broke in the
          # standalone binary (formatter WASM dropped from the npm snapshot,
          # `index.html` not bundled): exercise both, including a `yml` fence.
          smoke="$RUNNER_TEMP/wiki-smoke"
          mkdir -p "$smoke/wiki"
          printf 'wiki:\n  input: [wiki]\n' > "$smoke/wiki.yml"
          printf '# Smoke\n\n```yml\nkey:  value\n```\n' > "$smoke/wiki/Smoke.md"
          (
            cd "$smoke"
            "$output" -c wiki.yml fmt
            grep -q '^key: value$' wiki/Smoke.md
            "$output" -c wiki.yml build --no-check
            test -f _site/wiki/Smoke/index.html
          )

      - name: Run Docs Wiki Integrity Audits
        run: deno run -A src/wiki/cli.ts -c docs/wiki.yml check --strict -v

      - name: Run Docs Wiki Convention Audits
        run: deno run -A src/wiki/cli.ts -c docs/wiki.yml lint --strict -v

      - name: Verify Docs Wiki Formatting
        run: deno run -A src/wiki/cli.ts -c docs/wiki.yml fmt --check -v

      - name: Verify Docs Wiki SPARQL Blocks are Up to Date
        run: deno run -A src/wiki/cli.ts -c docs/wiki.yml render --check

  windows-tests:
    # Platform coverage for the paths ubuntu-latest cannot exercise at all:
    # source-name inference over backslash-separated paths, the symlink
    # capability probe, bash resolution in verify_cli_test, and the git-stderr
    # wording assertions. Each of those was fixed against a Windows host and
    # would silently regress without a runner here.
    #
    # Not a required status check on main's branch protection -- it is advisory
    # until the required contexts are updated, so a Windows failure will not
    # block a merge.
    name: Run Tests on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
          cache: true

      - name: Run Deno unit tests
        run: deno task test

  npm-checks:
    name: NPM Package Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Verify TypeScript Prettier formatting
        run: npm run format:check

      - name: Verify TypeScript ESLint
        run: npm run lint

      - name: Type-check the npm entrypoint
        run: npm run typecheck

      - name: Check npm and Deno version consistency
        run: |
          node -e 'const pkg = require("./package.json"); const deno = require("./deno.json"); if (pkg.version !== deno.version) { console.error(`Version mismatch: package.json=${pkg.version} deno.json=${deno.version}`); process.exit(1); }'

      - name: Build and test npm package
        run: npm run test:npm

      - name: Build static site
        run: deno run -A docs/build.ts --output-dir _site

      - name: Verify npm tarball CLI runs without Python or system Deno
        shell: bash
        run: |
          set -euo pipefail
          test_root="$RUNNER_TEMP/wiki-cli-tarball"
          blocked_path="$test_root/no-python"
          install_root="$test_root/install"
          mkdir -p "$blocked_path" "$install_root"
          for executable in python python2 python3 python3.10 python3.11 python3.12 python3.13 deno deno.exe; do
            printf '%s\n' '#!/usr/bin/env bash' 'echo "An external language runtime was invoked in this package test." >&2' 'exit 127' > "$blocked_path/$executable"
            chmod +x "$blocked_path/$executable"
          done
          tarball="$(npm pack --silent --pack-destination "$test_root")"
          case "$tarball" in
            /*) ;;
            *) tarball="$test_root/$tarball" ;;
          esac
          PATH="$blocked_path:$PATH" npm install --prefix "$install_root" --no-audit --no-fund "$tarball"
          PATH="$blocked_path:$PATH" "$install_root/node_modules/.bin/wiki" --help
          # `--help` never touches the tarball's non-TS payload
          # (`src/wiki/index.html`, `src/wiki/templates/**/*.yml`) or any write
          # path: scaffold a wiki and build it in the temp prefix. This also
          # exercises the first-run network fetch of the JSR/npm graph into
          # DENO_DIR, which `--help` never triggers.
          fixture="$test_root/fixture"
          mkdir -p "$fixture"
          (
            cd "$fixture"
            PATH="$blocked_path:$PATH" "$install_root/node_modules/.bin/wiki" init
            PATH="$blocked_path:$PATH" "$install_root/node_modules/.bin/wiki" build
          )
          test -f "$fixture/_site/wiki/index.html"

  python-checks:
    # Not a required status check on main's branch protection yet; advisory
    # until the required contexts are updated.
    name: PyPI Package Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # No setup-deno: the wheel must run on the `deno` PyPI dependency alone.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build the sdist and wheel
        run: uv build

      # Tests run against the installed wheel, never the source tree, so a
      # resource missing from the artifact fails here (#316). The end-to-end
      # tests strip PATH, so no system Deno, Node, or Python can stand in.
      - name: Install the wheel into a clean venv and test it
        shell: bash
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/wheel-venv"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python="$RUNNER_TEMP/wheel-venv/Scripts/python.exe"
          else
            python="$RUNNER_TEMP/wheel-venv/bin/python"
          fi
          uv pip install --python "$python" dist/wazootech_wiki-*.whl
          "$python" -m unittest discover -s python/tests -v
