name: code-health
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: File length (warn-only; 120 src / 300 test, blank/comment/import/re-export lines excluded)
        run: |
          git ls-files '*.ts' '*.tsx' '*.js' '*.mjs' \
            | grep -vE '(^|/)(node_modules|dist|generated|fixtures|\.next)/|\.d\.ts$|\.gen\.|openapi|snapshot|schema|^docs/assets/' \
            | while read -r f; do
                # Multi-line import / export-from statements (deno fmt wraps long
                # ones) are excluded like one-line ones; a plain `export { a };`
                # or `export const` is still code.
                n=$(awk '
                  function skip(l) { return l ~ /^[ \t]*($|\/\/|\/\*|\*)/ }
                  blk {
                    if (!skip($0)) buf++
                    if ($0 ~ /^[ \t]*\}/) { blk = 0; if ($0 !~ /from[ \t]*["'"'"']/) n += buf }
                    next
                  }
                  skip($0) { next }
                  /^[ \t]*export[ \t]+(type[ \t]+)?\{/ && !/\}/ { blk = 1; buf = 1; next }
                  /^[ \t]*import[ \t].*\{/ && !/\}/ { blk = 1; buf = 1; next }
                  /^[ \t]*import[ \t]/ { next }
                  /^[ \t]*export .* from/ { next }
                  { n++ }
                  END { print n + 0 }
                ' "$f")
                case "$f" in *.test.*|*.spec.*|*/tests/*|tests/*) max=300;; *) max=120;; esac
                if [ "$n" -gt "$max" ]; then echo "::warning file=$f::$n lines of code (limit $max)"; echo "- \`$f\`: $n (limit $max)" >> "$GITHUB_STEP_SUMMARY"; fi
              done
      - name: TODO/FIXME without an issue link (warn-only)
        run: |
          git grep -nE '\b(TODO|FIXME)\b' -- '*.ts' '*.tsx' '*.js' '*.mjs' ':!*generated*' \
            | grep -vE '#[0-9]+|/issues/[0-9]+' \
            | while IFS=: read -r f l _; do echo "::warning file=$f,line=$l::TODO/FIXME without an issue link"; done || true
