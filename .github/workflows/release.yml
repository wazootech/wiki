name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    name: Verify release versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
          cache: true

      - name: Verify package and engine versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION="$(node -p 'require("./package.json").version')"
          DENO_VERSION="$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"
          ENGINE_VERSION="$(sed -n 's/^export const VERSION = "\([^"]*\)";/\1/p' src/wiki/version.ts)"
          PYPI_VERSION="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml)"
          test -n "$NPM_VERSION" && test "$NPM_VERSION" = "$DENO_VERSION" && test "$NPM_VERSION" = "$ENGINE_VERSION" && test "$NPM_VERSION" = "$PYPI_VERSION" || {
            echo "::error::Version mismatch: package.json=$NPM_VERSION deno.json=$DENO_VERSION engine=$ENGINE_VERSION pyproject.toml=$PYPI_VERSION"
            exit 1
          }
          echo "version=$NPM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${{ steps.versions.outputs.version }}"
          test "$TAG" = "$VERSION" || { echo "::error::tag $TAG != package version $VERSION"; exit 1; }

      - name: Validate JSR package contents
        run: deno publish --dry-run

      # The release publishes the npm tarball, all six standalone binaries,
      # and the GitHub release from this commit: it must not ship untested.
      # (CI only runs on `main` pushes, so a tag push never triggers it.)
      - name: Type-check the engine
        run: deno task check

      - name: Run the engine test suite
        run: deno task test

  build-standalone:
    name: Build standalone (${{ matrix.slug }})
    needs: verify
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every `deno compile --target`. The PyPI wheels embed these, one
          # per target, so the list must match TARGETS in build_wheel.py.
          - slug: linux-x64
            target: x86_64-unknown-linux-gnu
          - slug: linux-arm64
            target: aarch64-unknown-linux-gnu
          - slug: windows-x64
            target: x86_64-pc-windows-msvc
            extension: .exe
          - slug: windows-arm64
            target: aarch64-pc-windows-msvc
            extension: .exe
          - slug: macos-x64
            target: x86_64-apple-darwin
          - slug: macos-arm64
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
          cache: true

      - name: Compile standalone executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/standalone
          output="dist/standalone/wazootech-wiki-${{ matrix.slug }}${{ matrix.extension }}"
          deno compile --node-modules-dir=none --frozen --allow-all --exclude-unused-npm --target "${{ matrix.target }}" --output "$output" src/wiki/cli.ts
          if [ "${{ matrix.slug }}" = "linux-x64" ]; then
            "$output" --help
            "$output" -c docs/wiki.yml check --strict
          fi

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.slug }}
          path: dist/standalone/wazootech-wiki-*
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    # JSR is not published from this workflow: `publish-jsr.yml` publishes
    # @wazoo/wiki when a new version reaches `main`, so npm consumers never
    # depend on a JSR release happening alongside a tag.
    needs: [verify, build-standalone]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download standalone artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: standalone-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum wazootech-wiki-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/wazootech-wiki-*
            release-assets/SHA256SUMS

  publish-npm:
    name: Publish npm
    needs: [verify, publish-github-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify npm can pack
        run: npm pack --dry-run

      - name: Publish to npm (trusted publishing / OIDC)
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          if npm view "wazootech-wiki@${VERSION}" version 2>/dev/null | grep -qx "${VERSION}"; then
            echo "wazootech-wiki@${VERSION} already on registry; skipping publish."
            exit 0
          fi
          npm publish --provenance --access public

      - name: Verify npm publish
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          for attempt in 1 2 3 4 5 6; do
            if npm view "wazootech-wiki@${VERSION}" version 2>/dev/null | grep -qx "${VERSION}"; then
              echo "Verified wazootech-wiki@${VERSION} on registry."
              exit 0
            fi
            echo "Attempt ${attempt}/6: version not visible yet; waiting..."
            sleep 10
          done
          echo "::error::wazootech-wiki@${VERSION} not found on registry after retries."
          exit 1

  publish-pypi:
    name: Publish PyPI
    # Set the repository variable PYPI_PUBLISH_ENABLED=true, and trust this
    # workflow and the `pypi` environment as a Trusted Publisher on the
    # `wazootech-wiki` PyPI project, to enable. No API token is stored.
    #
    # Each platform wheel embeds the standalone binary for its target, so the
    # wheels are built from the GitHub Release's own assets, after the release
    # exists and its SHA256SUMS verifies them: a wheel can never ship a binary
    # the release does not, or ship before it.
    needs: [verify, publish-github-release]
    if: >-
      vars.PYPI_PUBLISH_ENABLED == 'true' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Download and verify the release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --dir release-assets \
            --pattern 'wazootech-wiki-*' --pattern SHA256SUMS
          cd release-assets
          sha256sum --check --strict SHA256SUMS

      - name: Build one wheel per target, plus the fallback
        run: |
          set -euo pipefail
          while read -r slug target; do
            binary="release-assets/wazootech-wiki-$slug"
            [ -f "$binary.exe" ] && binary="$binary.exe"
            python scripts/build_wheel.py --binary "$binary" --target "$target" --out dist
          done <<'TARGETS'
          linux-x64 x86_64-unknown-linux-gnu
          linux-arm64 aarch64-unknown-linux-gnu
          macos-x64 x86_64-apple-darwin
          macos-arm64 aarch64-apple-darwin
          windows-x64 x86_64-pc-windows-msvc
          windows-arm64 aarch64-pc-windows-msvc
          TARGETS
          python scripts/build_wheel.py --pure --out dist
          test "$(ls dist/*.whl | wc -l)" -eq 7
          uvx twine check --strict dist/*.whl
          ls -l dist

      # The same installed-artifact tests CI runs: the release must not ship
      # a wheel nobody installed.
      - name: Test the Linux x64 and fallback wheels from clean venvs
        run: |
          set -euo pipefail
          uv venv -q "$RUNNER_TEMP/platform-venv"
          uv pip install --python "$RUNNER_TEMP/platform-venv/bin/python" dist/*-manylinux_2_27_x86_64.whl
          "$RUNNER_TEMP/platform-venv/bin/python" -m unittest discover -s python/tests -v
          uv venv -q "$RUNNER_TEMP/fallback-venv"
          uv pip install --python "$RUNNER_TEMP/fallback-venv/bin/python" dist/*-py3-none-any.whl
          WIKI_TEST_BINARY="$RUNNER_TEMP/platform-venv/bin/wiki" WIKI_REQUIRE_E2E=1 \
            "$RUNNER_TEMP/fallback-venv/bin/python" -m unittest discover -s python/tests -v

      - name: Skip when the version is already on PyPI
        id: published
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/wazootech-wiki/${VERSION}/json")"
          if [ "$STATUS" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "wazootech-wiki ${VERSION} is already on PyPI; skipping publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        if: steps.published.outputs.already == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Verify PyPI publish
        if: steps.published.outputs.already == 'false'
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          for attempt in 1 2 3 4 5 6; do
            STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
              "https://pypi.org/pypi/wazootech-wiki/${VERSION}/json")"
            if [ "$STATUS" = "200" ]; then
              echo "Verified wazootech-wiki ${VERSION} on PyPI."
              exit 0
            fi
            echo "Attempt ${attempt}/6: version not visible yet (status ${STATUS}); waiting..."
            sleep 10
          done
          echo "::error::wazootech-wiki ${VERSION} not found on PyPI after retries."
          exit 1
