name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    name: Verify release versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Verify package and engine versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION="$(node -p 'require("./package.json").version')"
          DENO_VERSION="$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"
          ENGINE_VERSION="$(sed -n 's/^export const VERSION = "\([^"]*\)";/\1/p' src/wiki/version.ts)"
          test -n "$NPM_VERSION" && test "$NPM_VERSION" = "$DENO_VERSION" && test "$NPM_VERSION" = "$ENGINE_VERSION" || {
            echo "::error::Version mismatch: package.json=$NPM_VERSION deno.json=$DENO_VERSION engine=$ENGINE_VERSION"
            exit 1
          }
          echo "version=$NPM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${{ steps.versions.outputs.version }}"
          test "$TAG" = "$VERSION" || { echo "::error::tag $TAG != package version $VERSION"; exit 1; }

      - name: Validate JSR package contents
        run: deno publish --dry-run

  build-standalone:
    name: Build standalone (${{ matrix.slug }})
    needs: verify
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: linux-x64
            target: x86_64-unknown-linux-gnu
          - slug: windows-x64
            target: x86_64-pc-windows-msvc
            extension: .exe
          - slug: macos-arm64
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Compile standalone executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/standalone
          output="dist/standalone/wazootech-wiki-${{ matrix.slug }}${{ matrix.extension }}"
          deno compile --node-modules-dir=none --frozen --allow-all --exclude-unused-npm --target "${{ matrix.target }}" --output "$output" src/wiki/cli.ts
          if [ "${{ matrix.slug }}" = "linux-x64" ]; then
            "$output" --help
            "$output" -c docs/wiki.yml check --strict
          fi

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.slug }}
          path: dist/standalone/wazootech-wiki-*
          if-no-files-found: error

  publish-jsr:
    name: Publish JSR
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Publish to JSR (GitHub OIDC)
        run: deno publish

  publish-github-release:
    name: Publish GitHub Release
    needs: [verify, build-standalone, publish-jsr]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download standalone artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: standalone-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum wazootech-wiki-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/wazootech-wiki-*
            release-assets/SHA256SUMS

  publish-npm:
    name: Publish npm
    needs: [verify, publish-github-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify npm can pack
        run: npm pack --dry-run

      - name: Publish to npm (trusted publishing / OIDC)
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          if npm view "wazootech-wiki@${VERSION}" version 2>/dev/null | grep -qx "${VERSION}"; then
            echo "wazootech-wiki@${VERSION} already on registry; skipping publish."
            exit 0
          fi
          npm publish --provenance --access public

      - name: Verify npm publish
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          for attempt in 1 2 3 4 5 6; do
            if npm view "wazootech-wiki@${VERSION}" version 2>/dev/null | grep -qx "${VERSION}"; then
              echo "Verified wazootech-wiki@${VERSION} on registry."
              exit 0
            fi
            echo "Attempt ${attempt}/6: version not visible yet; waiting..."
            sleep 10
          done
          echo "::error::wazootech-wiki@${VERSION} not found on registry after retries."
          exit 1
