name: Release

# Keep this filename release.yml: npm trusted publishing is bound to it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_npm:
        description: Skip npm publish
        type: boolean
        default: false
      skip_binaries:
        description: Skip standalone binaries and GitHub Release upload
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    name: Verify release versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Verify Deno, npm, and CLI versions
        id: versions
        run: deno run --allow-read --allow-write scripts/set_version.ts --check --github-output "$GITHUB_OUTPUT"

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          test "$TAG" = "$VERSION" || { echo "::error::tag $TAG != version $VERSION"; exit 1; }

  publish-npm:
    name: Publish npm
    needs: verify
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && !inputs.skip_npm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install package dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build and verify npm package
        run: |
          npm run build
          npm pack --dry-run --ignore-scripts

      - name: Publish to npm (trusted publishing / OIDC)
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          if npm view "wazootech-wiki@${VERSION}" version 2>/dev/null | grep -qx "${VERSION}"; then
            echo "wazootech-wiki@${VERSION} already on registry; skipping publish."
            exit 0
          fi
          npm publish --provenance --access public

      - name: Verify npm publish
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          for attempt in 1 2 3 4 5 6; do
            if npm view "wazootech-wiki@${VERSION}" version 2>/dev/null | grep -qx "${VERSION}"; then
              echo "Verified wazootech-wiki@${VERSION} on registry."
              exit 0
            fi
            echo "Attempt ${attempt}/6: version not visible yet; waiting..."
            sleep 10
          done
          echo "::error::wazootech-wiki@${VERSION} not found on registry after retries."
          exit 1

  build-standalone:
    name: Build standalone (${{ matrix.slug }})
    needs: verify
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && !inputs.skip_binaries)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            slug: linux-x64
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            slug: windows-x64
            target: x86_64-pc-windows-msvc
          - runner: macos-14
            slug: macos-arm64
            target: aarch64-apple-darwin
          # Intel macOS remains disabled while its runner pool is unavailable.
          # - runner: macos-13
          #   slug: macos-x64
          #   target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Compile, package, and smoke-test standalone executable
        run: deno run -A scripts/build_standalone.ts --target "${{ matrix.target }}" --smoke-check
        shell: bash

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.slug }}
          path: dist/standalone/*-${{ matrix.slug }}.*
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    needs: [verify, build-standalone]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download standalone artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: standalone-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum wazootech-wiki-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/wazootech-wiki-*
            release-assets/SHA256SUMS
